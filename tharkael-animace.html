const data=[['Zha’kûr','Žhavý svět',9, ['Povrch pokrývají lávová pole.','Nejbližší planeta dvojice sluncí.']],['Vaerqën','Pouštní svět',12,['Atmosférou se valí obrovské prachové bouře.','Z vesmíru působí zlatavě.']],['Antirōs','Domov Ayru',17,['Pět kontinentů, dvanáct biomů a 36 kmenů.','Jeden den trvá 36 pozemských hodin.','Rok má 480 místních dní.']],['Oq’tharai','Oceánský svět',14,['Jeho povrch ovládají hluboké oceány.','Nad vodou vznikají mohutné bouře.']],['Nysh’vara','Krystalický svět',12,['Temné horniny protínají fialová minerální ložiska.','Krystaly mohou odrážet světlo obou sluncí.']],['Ghaurën','Plynný obr',23,['Zelenavá atmosféra je plná obřích vírů.','Nemá běžný pevný povrch.']],['Sëlarûn','Prstencový obr',22,['Prstence tvoří led a prach.','Jeho atmosféra má fialové a růžové pásy.']],['Qir’vhaël','Ledový svět',15,['Povrch je pokrytý ledem.','Pod ledovou kůrou by se mohl ukrývat oceán.']],['Ur’khaos','Temný svět',12,['Nejvzdálenější z devíti planet.','Dopadá na něj jen slabé světlo sluncí.']]];
const ns='http://www.w3.org/2000/svg',el=(tag,attrs,parent)=>{let e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e};let seed=145;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};for(let i=0;i<135;i++)el('circle',{cx:rnd()*1000,cy:rnd()*830,r:.25+rnd()*1.1,fill:['#e7dcff','#b3d5ff','#fff1d5'][i%3],opacity:.06+rnd()*.30},document.querySelector('#stars'));

function select(i){selected=i;document.querySelector('#layout').classList.add('open');const panel=document.querySelector('#panel');panel.inert=false;panel.setAttribute('aria-hidden','false');const d=data[i];document.querySelector('#portrait').src=images[i];document.querySelector('#portrait').alt=d[0];document.querySelector('#portrait').classList.toggle('ringed',i===6);document.querySelector('#kind').textContent=`${String(i+1).padStart(2,'0')} • ${d[1]}`;document.querySelector('#name').textContent=d[0];let ul=document.querySelector('#facts');ul.replaceChildren(...d[3].map(f=>{let li=document.createElement('li');li.textContent=f;return li}));document.querySelector('#status').textContent=i===2?'Potvrzené údaje o Antirōsu':'Pracovní návrh • ke schválení';worlds.forEach((w,j)=>{w.g.classList.toggle('active',j===i);w.g.setAttribute('aria-pressed',j===i)})}
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(!paused)clock+=dt;let suns=clock*.12;document.querySelector('#suns').setAttribute('transform',`translate(${cx-18*Math.cos(suns)} ${cy-8*Math.sin(suns)}) rotate(${Math.sin(suns)*16})`);worlds.forEach((w,i)=>{let a=phase[i]+clock*(.36/Math.pow(1+i*.36,1.35));w.g.setAttribute('transform',`translate(${cx+rx[i]*Math.cos(a)} ${cy+ry[i]*Math.sin(a)})`)});requestAnimationFrame(frame)}
function closePanel(){const old=selected;selected=-1;document.querySelector('#layout').classList.remove('open');const panel=document.querySelector('#panel');panel.inert=true;panel.setAttribute('aria-hidden','true');worlds.forEach(w=>{w.g.classList.remove('active');w.g.setAttribute('aria-pressed','false')});if(old>=0)worlds[old].g.focus({preventScroll:true});}document.querySelector('#close').addEventListener('click',closePanel);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected>=0)closePanel()});document.querySelector('#sky').addEventListener('click',e=>{if(!e.target.closest('.planet')&&selected>=0)closePanel()});requestAnimationFrame(frame);
</script></html>
